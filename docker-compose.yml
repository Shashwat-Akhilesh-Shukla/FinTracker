services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintracker
      POSTGRES_PASSWORD: fintracker123
      POSTGRES_DB: fintracker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # API Gateway
  api_gateway:
    build:
      context: ./backend/api_gateway
      dockerfile: Dockerfile
    environment:
      # Override service URLs for Docker
      AUTH_SERVICE_URL: http://auth_service:8001
      PORTFOLIO_SERVICE_URL: http://portfolio_service:8002
      NEWS_SERVICE_URL: http://news_service:8003
      QUANT_SERVICE_URL: http://quant_service:8004
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
      - portfolio_service
      - news_service
      - quant_service
      - postgres
      - redis
    restart: on-failure

  auth_service:
    build:
      context: ./backend/auth_service
      dockerfile: Dockerfile
    env_file:
      - ./backend/auth_service/.env
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  portfolio_service:
    build:
      context: ./backend/portfolio_service
      dockerfile: Dockerfile
    env_file:
      - ./backend/portfolio_service/.env
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  news_service:
    build:
      context: ./backend/news_service
      dockerfile: Dockerfile
    env_file:
      - ./backend/news_service/.env
    ports:
      - "8003:8003"
    depends_on:
      - postgres
    restart: on-failure

  quant_service:
    build:
      context: ./backend/quant_service
      dockerfile: Dockerfile
    env_file:
      - ./backend/quant_service/.env
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"
    depends_on:
      - api_gateway
    restart: on-failure

volumes:
  pgdata:

version: "1.0"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintracker
      POSTGRES_PASSWORD: fintracker_pass
      POSTGRES_DB: fintracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # API Gateway
  api-gateway:
  build:
    context: ./backend/api-gateway
    dockerfile: Dockerfile
  env_file:
    - ./backend/api-gateway/.env
  environment:
    # Override service URLs for Docker
    AUTH_SERVICE_URL: http://auth-service:8001
    PORTFOLIO_SERVICE_URL: http://portfolio-service:8002
    NEWS_SERVICE_URL: http://news-service:8003
    QUANT_SERVICE_URL: http://quant-service:8004
    # Expose the port to the app (uvicorn)
    PORT: 8000
  ports:
    - "8000:8000"
  depends_on:
    - auth-service
    - portfolio-service
    - news-service
    - quant-service
    - postgres
    - redis
  restart: on-failure


  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./backend/auth-service/.env
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  portfolio-service:
    build:
      context: ./backend/portfolio-service
      dockerfile: Dockerfile
      args:
        PORT: 8002
    env_file:
      - ./backend/portfolio-service/.env
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  news-service:
    build:
      context: ./backend/news-service
      dockerfile: Dockerfile
      args:
        PORT: 8003
    env_file:
      - ./backend/news-service/.env
    ports:
      - "8003:8003"
    depends_on:
      - postgres
    restart: on-failure

  quant-service:
    build:
      context: ./backend/quant-service
      dockerfile: Dockerfile
      args:
        PORT: 8004
    env_file:
      - ./backend/quant-service/.env
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"   # built frontend served on container port 80; host uses 3000 to match your dev habit
    depends_on:
      - api-gateway
    restart: on-failure

volumes:
  pgdata:
